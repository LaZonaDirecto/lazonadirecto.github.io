<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Zona en Directo</title>
<meta name="description" content="Los directos de los streamers de España en una sola pantalla, con aviso cuando pasa algo.">
<meta name="theme-color" content="#0A0F24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<style>
  :root{
    /* Paleta "sala de realización": fondo noche, rojo de programa, verde de previo */
    --noche:#0A0F24;
    --panel:#111833;
    --panel-2:#18213F;
    --borde:#26305A;
    --texto:#EEF1FF;
    --suave:#8E96C4;
    --pgm:#FF2D55;      /* en antena / en directo */
    --pvw:#19E3A0;      /* previo / momento nuevo */
    --r-xl:22px; --r-md:14px; --r-sm:10px;
    --display:'Bricolage Grotesque', 'Manrope', system-ui, sans-serif;
    --body:'Manrope', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 70% -10%, #1B2558 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #2A0F35 0%, transparent 55%),
      var(--noche);
    color:var(--texto);font-family:var(--body);font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  :focus-visible{outline:2px solid var(--pvw);outline-offset:2px;border-radius:8px}

  .app{display:grid;grid-template-rows:auto 1fr;height:100%;max-width:1680px;margin:0 auto}

  /* ---------- Cabecera ---------- */
  .top{display:flex;align-items:center;gap:18px;padding:16px 22px}
  .marca{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--texto)}
  .marca .tally{width:14px;height:14px;border-radius:50%;background:var(--pgm);box-shadow:0 0 0 4px rgba(255,45,85,.18),0 0 18px var(--pgm)}
  .marca b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.03em;line-height:1}
  .marca small{display:block;font-size:12px;color:var(--suave);font-weight:600;letter-spacing:.01em;margin-top:2px}
  .esp{flex:1}
  .vistas{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--borde);border-radius:999px}
  .vistas button{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;color:var(--suave);font-weight:700;font-size:13px}
  .vistas button[aria-pressed="true"]{background:var(--panel-2);color:var(--texto);box-shadow:inset 0 0 0 1px var(--borde)}
  .vistas svg{width:16px;height:16px}
  .boton{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--borde);font-weight:700;font-size:13px}
  .boton .luz{width:8px;height:8px;border-radius:50%;background:var(--pvw);box-shadow:0 0 10px var(--pvw)}
  .boton[aria-pressed="false"] .luz{background:#4A5277;box-shadow:none}
  .boton[aria-pressed="false"]{color:var(--suave)}

  /* ---------- Cuerpo ---------- */
  .zona{display:flex;flex-direction:column;min-height:0}
  .cuerpo{flex:1;display:grid;grid-template-columns:1fr 320px;gap:18px;padding:0 22px 22px;min-height:0}
  .escenario{display:flex;flex-direction:column;min-height:0;gap:14px}

  .monitores{flex:1;display:grid;gap:12px;min-height:0}
  .monitores.n1{grid-template-columns:1fr}
  .monitores.n2{grid-template-columns:1fr 1fr}
  .monitores.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}

  .monitor{position:relative;border-radius:var(--r-xl);overflow:hidden;background:#000;min-height:0;
    box-shadow:0 0 0 1px var(--borde), 0 30px 60px -30px rgba(0,0,0,.8)}
  .monitor.antena{box-shadow:0 0 0 2px var(--pgm), 0 0 40px -8px rgba(255,45,85,.55), 0 30px 60px -30px rgba(0,0,0,.8)}
  .monitor .vid{position:absolute;inset:0}
  .monitor .vid iframe{width:100%;height:100%;border:0;display:block}
  .monitor .rotulo{position:absolute;left:14px;top:14px;z-index:3;display:flex;align-items:center;gap:8px;
    padding:6px 12px 6px 8px;border-radius:999px;background:rgba(10,15,36,.78);backdrop-filter:blur(8px);
    font-weight:700;font-size:13px;pointer-events:none}
  .monitor .rotulo .av{width:22px;height:22px;font-size:10px}
  .monitor.antena .rotulo{background:var(--pgm)}
  .monitor .oir{position:absolute;right:14px;top:14px;z-index:3;padding:7px 12px;border-radius:999px;
    background:rgba(10,15,36,.78);backdrop-filter:blur(8px);font-weight:700;font-size:12px}
  .monitor .oir:hover{background:var(--panel-2)}

  /* Ficha bajo el monitor principal */
  .ficha{display:flex;align-items:center;gap:14px;padding:4px 4px 0}
  .ficha .av{width:46px;height:46px;font-size:17px}
  .ficha h1{margin:0;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.025em;line-height:1.05}
  .ficha p{margin:2px 0 0;color:var(--suave);font-weight:600}
  .ficha .volver{margin-left:auto}

  /* Avatares con monograma (color propio por canal) */
  .av{display:grid;place-items:center;border-radius:50%;font-family:var(--display);font-weight:800;color:#fff;flex:0 0 auto;
    background:hsl(var(--h) 70% 42%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
  .av.tv{background:#2B335E}

  /* ---------- Carril de canales ---------- */
  .carril{display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,var(--panel),rgba(17,24,51,.6));
    border:1px solid var(--borde);border-radius:var(--r-xl);overflow:hidden}
  .carril header{padding:18px 18px 10px}
  .carril h2{margin:0;font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.02em}
  .carril header p{margin:3px 0 0;color:var(--suave);font-size:13px}
  .lista{overflow-y:auto;padding:4px 10px 14px;scrollbar-width:thin;scrollbar-color:var(--borde) transparent}
  .grupo{margin:12px 8px 6px;color:var(--suave);font-size:12px;font-weight:700}
  .canal{width:100%;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--r-md);text-align:left}
  .canal:hover{background:var(--panel-2)}
  .canal .av{width:38px;height:38px;font-size:14px;position:relative}
  .canal.vivo .av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;
    background:var(--pgm);box-shadow:0 0 0 3px var(--panel)}
  .canal .txt{min-width:0;flex:1}
  .canal .nom{display:block;font-weight:700}
  .canal .que{display:block;color:var(--suave);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .canal .pantalla{font-size:11.5px;font-weight:700;color:var(--pgm)}
  .canal[aria-current="true"]{background:rgba(255,45,85,.08);box-shadow:inset 0 0 0 1px rgba(255,45,85,.35)}

  .sectores{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .sectores button{padding:7px 11px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--suave);background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--borde);display:flex;align-items:center;gap:6px}
  .sectores button[aria-selected="true"]{background:var(--texto);color:var(--noche);box-shadow:none}
  .sectores i{font-style:normal;font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--pgm);color:#fff;display:grid;place-items:center}
  #franja{margin:3px 0 0;color:var(--suave);font-size:13px}
  /* ---------- Última hora ---------- */
  .ultima{display:none;align-items:center;gap:14px;margin:0 22px 14px;padding:12px 16px;border-radius:var(--r-md);
    background:linear-gradient(90deg,#B0103A,#FF2D55);font-weight:700}
  .ultima.si{display:flex}
  .ultima strong{font-family:var(--display);font-size:16px;letter-spacing:-.01em}
  .ultima button{margin-left:auto;background:#fff;color:#7A0B28;padding:8px 14px;border-radius:999px;font-weight:800}

  /* ---------- Previo (aviso de momento) ---------- */
  .previo{position:fixed;right:24px;bottom:24px;z-index:50;width:440px;max-width:calc(100vw - 20px);
    background:rgba(17,24,51,.92);backdrop-filter:blur(18px);border-radius:var(--r-xl);overflow:hidden;
    box-shadow:0 0 0 2px var(--pvw), 0 0 50px -10px rgba(25,227,160,.5), 0 40px 80px -20px rgba(0,0,0,.9);
    transform:translateY(calc(100% + 40px)) scale(.98);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.25,1.15), opacity .3s}
  .previo.si{transform:none;opacity:1}
  .previo.urgente{box-shadow:0 0 0 2px var(--pgm), 0 0 50px -10px rgba(255,45,85,.6), 0 40px 80px -20px rgba(0,0,0,.9)}
  .previo .cab{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
  .previo .av{width:40px;height:40px;font-size:15px}
  .previo .estado{font-size:12px;font-weight:800;color:var(--pvw);display:flex;align-items:center;gap:6px}
  .previo.urgente .estado{color:#FF7A93}
  .previo .estado::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;animation:latido 1.2s ease-in-out infinite}
  .previo h3{margin:2px 0 0;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.025em;line-height:1.08}
  .previo .reloj{margin-left:auto;width:34px;height:34px;flex:0 0 auto}
  .previo .reloj circle{fill:none;stroke-width:3}
  .previo .reloj .fondo{stroke:var(--borde)}
  .previo .reloj .resto{stroke:var(--pvw);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
  .previo.urgente .reloj .resto{stroke:var(--pgm)}
  .previo .frase{margin:0;padding:0 16px 12px;color:var(--suave);font-size:14px}
  .previo .frase b{color:var(--texto);font-weight:700}
  .previo .tele{position:relative;height:248px;background:#000;margin:0 12px;border-radius:var(--r-md);overflow:hidden}
  .previo .tele iframe,.previo .tele>div{width:100%;height:100%;border:0;display:block}
  .previo .acciones{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;padding:12px}
  .previo .acciones button{padding:14px;border-radius:var(--r-md);font-weight:800;font-size:15px}
  .cambiar{background:var(--pvw);color:#032B1E}
  .previo.urgente .cambiar{background:var(--pgm);color:#fff}
  .seguir{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--borde)}

  .boton.volver{background:var(--panel-2)}
  .aviso-corto{position:fixed;left:50%;top:22px;transform:translate(-50%,-30px);opacity:0;z-index:60;padding:10px 16px;border-radius:999px;
    background:var(--panel-2);box-shadow:0 0 0 1px var(--borde);font-weight:700;font-size:13px;transition:.3s}
  .aviso-corto.si{transform:translate(-50%,0);opacity:1}

  @keyframes latido{50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---------- Móvil ---------- */
  @media (max-width:1000px){
    .cuerpo{grid-template-columns:1fr;grid-template-rows:auto auto;overflow-y:auto}
    .monitores{aspect-ratio:16/9;flex:none}
    .monitores.n2,.monitores.n4{aspect-ratio:auto;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0, calc((100vw - 56px)/2*9/16))}
    .carril{max-height:none}
    .lista{max-height:none}
    .app{height:auto;min-height:100%}
  }
  @media (max-width:600px){
    .top{padding:12px 14px;gap:10px;flex-wrap:wrap}
    .marca small{display:none}
    .vistas button span{display:none}
    .boton .txt{display:none}
    .cuerpo{padding:0 12px 16px;gap:14px}
    .ficha h1{font-size:22px}
    .ficha .av{width:40px;height:40px}
    .previo{right:10px;left:10px;bottom:10px;width:auto}
    .previo .tele{height:200px}
    .ultima{margin:0 12px 12px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a class="marca" href="./" aria-label="La Zona en Directo, inicio">
      <span class="tally" aria-hidden="true"></span>
      <span><b>La Zona en Directo</b><small>Los directos de España en una pantalla</small></span>
    </a>
    <div class="esp"></div>
    <div class="vistas" role="group" aria-label="Pantallas a la vez">
      <button data-n="1" aria-pressed="true" title="Una pantalla"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="3" width="14" height="10" rx="2"/></svg><span>Una</span></button>
      <button data-n="2" aria-pressed="false" title="Dos pantallas"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="4" width="6.5" height="8" rx="1.5"/><rect x="8.5" y="4" width="6.5" height="8" rx="1.5"/></svg><span>Dos</span></button>
      <button data-n="4" aria-pressed="false" title="Cuatro pantallas"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="6.5" height="5.5" rx="1.2"/><rect x="8.5" y="2" width="6.5" height="5.5" rx="1.2"/><rect x="1" y="8.5" width="6.5" height="5.5" rx="1.2"/><rect x="8.5" y="8.5" width="6.5" height="5.5" rx="1.2"/></svg><span>Cuatro</span></button>
    </div>
    <button class="boton" id="avisos" aria-pressed="true" title="Avisarme cuando pase algo en otro directo"><span class="luz"></span><span class="txt">Avisos activados</span></button>
    <button class="boton" id="probar" title="Ver cómo es un aviso"><span class="txt">Probar aviso</span><span aria-hidden="true">⚡</span></button>
  </div>

  <div class="zona">
    <div class="ultima" id="ultima" role="alert"><strong>Última hora</strong><span id="ultimaTxt"></span><button id="ultimaVer">Ver ahora</button></div>
    <div class="cuerpo">
      <section class="escenario" aria-label="Directos">
        <div class="monitores n1" id="monitores"></div>
        <div class="ficha" id="ficha"></div>
      </section>
      <aside class="carril" aria-label="Canales">
        <header><h2>Canales</h2><p id="franja"></p><div class="sectores" id="sectores" role="tablist" aria-label="Sectores"></div></header>
        <div class="lista" id="lista"></div>
      </aside>
    </div>
  </div>
</div>

<div class="previo" id="previo" role="dialog" aria-label="Está pasando algo en otro directo" aria-hidden="true">
  <div class="cab">
    <span class="av" id="pAv"></span>
    <div><div class="estado" id="pEstado">Está pasando ahora</div><h3 id="pTema"></h3></div>
    <svg class="reloj" viewBox="0 0 36 36" aria-hidden="true"><circle class="fondo" cx="18" cy="18" r="15"/><circle class="resto" id="pReloj" cx="18" cy="18" r="15" stroke-dasharray="94.25" stroke-dashoffset="0"/></svg>
  </div>
  <p class="frase" id="pFrase"></p>
  <div class="tele" id="pTele"></div>
  <div class="acciones"><button class="cambiar" id="pCambiar">Cambiar a este directo</button><button class="seguir" id="pSeguir">Seguir aquí</button></div>
</div>
<div class="aviso-corto" id="corto" role="status"></div>

<script>
/* ================= Canales por sectores =================
   sec: es (España, tarde-noche) · latam (Latinoamérica, noche y madrugada en España)
        esports (competiciones y eventos, a cualquier hora) · noticias (24 h)
   Los de Kick llevan id "kick:<canal>" y los de tele "tv:<canal>". */
const CANALES = [
  // España
  {id:'ibai',n:'Ibai',sec:'es'},{id:'rubius',n:'Rubius',sec:'es'},{id:'illojuan',n:'IlloJuan',sec:'es'},
  {id:'elxokas',n:'Xokas',sec:'es'},{id:'auronplay',n:'Auronplay',sec:'es'},{id:'thegrefg',n:'TheGrefg',sec:'es'},
  {id:'knekro',n:'Knekro',sec:'es'},{id:'mixwell',n:'Mixwell',sec:'es'},{id:'peereira7',n:'Pereira',sec:'es'},
  {id:'agustin51',n:'Agustin51',sec:'es'},{id:'nilojeda',n:'Nil Ojeda',sec:'es'},{id:'djmariio',n:'DjMaRiiO',sec:'es'},
  {id:'baitybait',n:'BaityBait',sec:'es'},{id:'revenant',n:'Revenant',sec:'es'},{id:'lolito',n:'Lolito',sec:'es'},
  {id:'spursito',n:'Spursito',sec:'es'},{id:'cristinini',n:'Cristinini',sec:'es'},{id:'nissaxter',n:'Nissaxter',sec:'es'},
  {id:'zeling',n:'Zeling',sec:'es'},{id:'vegetta777',n:'Vegetta777',sec:'es'},{id:'willyrex',n:'Willyrex',sec:'es'},
  // Latinoamérica
  {id:'kick:westcol',n:'Westcol',sec:'latam'},{id:'kick:davooxeneize',n:'Davoo Xeneize',sec:'latam'},
  {id:'kick:lacobraaa',n:'La Cobra',sec:'latam'},{id:'kick:spreen',n:'Spreen',sec:'latam'},
  {id:'kick:mrstiventc',n:'MrStiven',sec:'latam'},{id:'kick:rdjavi',n:'RDJavi',sec:'latam'},
  {id:'kick:kingteka',n:'Kingteka',sec:'latam'},{id:'kick:adrianozendejas32',n:'Adrián Ozendejas',sec:'latam'},
  {id:'juansguarnizo',n:'Juan Guarnizo',sec:'latam'},{id:'rivers_gg',n:'Rivers',sec:'latam'},
  {id:'crystalmolly',n:'Crystal Molly',sec:'latam'},
  // Esports y eventos
  {id:'les',n:'LES · Liga española de LoL',sec:'esports'},{id:'lolesportsla',n:'LoL Esports en español',sec:'esports'},
  {id:'kingsleague',n:'Kings League',sec:'esports'},
  // Noticias
  {id:'tv:rtve24h',n:'Canal 24 Horas',sec:'noticias',sub:'RTVE · noticias',yt:'UC7QZIf0dta-XPXsp9Hv4dTw',video:'b4tE5aKhtlg'}
];
const SECTORES = [
  {id:'ahora',n:'Ahora'},{id:'es',n:'España'},{id:'latam',n:'Latinoamérica'},{id:'esports',n:'Esports y eventos'},{id:'noticias',n:'Noticias'}
];
/* Franjas (hora de España): qué sector suele tener más directos */
function franja(h=new Date().getHours()){
  if(h>=2&&h<9)  return {id:'madrugada',n:'De madrugada',orden:['latam','esports','noticias','es']};
  if(h>=9&&h<15) return {id:'manana',n:'Por la mañana',orden:['esports','es','latam','noticias']};
  if(h>=15&&h<23)return {id:'tarde',n:'Por la tarde',orden:['es','esports','latam','noticias']};
  return {id:'noche',n:'Por la noche',orden:['es','latam','esports','noticias']};
}

const ESTADO_URL='estado.json', POLL_MS=20000, AVISO_SEG=25, MAX_EDAD_MIN=10;
const HOST=location.hostname||'localhost';

/* ================= Estado ================= */
let n=1, tiles=[], sel=0, live=new Set(), info={}, avisos=true, vistos=new Set(), cola=[], actual=null, timer=null, anterior=null;
let sector='ahora', tocado=false, saltos=0;
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('lzd_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('lzd_'+k,JSON.stringify(v))}catch(e){}}};
avisos=store.get('avisos',true); vistos=new Set(store.get('vistos',[]));

const esTV=s=>s.startsWith('tv:'), esKick=s=>s.startsWith('kick:'), esTwitch=s=>!esTV(s)&&!esKick(s);
const canal=s=>CANALES.find(x=>x.id===s)||{id:s,n:s,sec:'es'};
const nombre=s=>canal(s).n;
const slug=s=>s.replace(/^(kick|tv):/,'');
function tono(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function avatar(s,cls='av'){const c=canal(s);const ini=esTV(s)?'24h':c.n.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9]/g,'').slice(0,2);
  return `<span class="${cls}${esTV(s)?' tv':''}" style="--h:${tono(s)}" aria-hidden="true">${ini}</span>`}
function plataforma(s){return esTV(s)?'YouTube':esKick(s)?'Kick':'Twitch'}
function queHace(s){ const c=canal(s); if(esTV(s)) return c.sub; const i=info[s];
  if(live.has(s)) return i&&i.categoria? i.categoria : 'En directo'; return esKick(s)?'Kick':'Sin conexión'; }
function corto(t){const e=$('#corto');e.textContent=t;e.classList.add('si');clearTimeout(e._h);e._h=setTimeout(()=>e.classList.remove('si'),2600)}

/* ================= Reproductores ================= */
function iframe(src,muted){
  if(esTV(src)){const c=canal(src);const v=(info[src]&&info[src].video)||c.video;return v?`https://www.youtube.com/embed/${v}?autoplay=1&mute=${muted?1:0}`:`https://www.youtube.com/embed/live_stream?channel=${c.yt}&autoplay=1&mute=${muted?1:0}`;}
  if(esKick(src)) return `https://player.kick.com/${slug(src)}?autoplay=true&muted=${muted?'true':'false'}`;
}
function montar(el,src,muted){
  el.querySelector('.vid')?.remove();
  const box=document.createElement('div');box.className='vid';box.id='v'+Math.random().toString(36).slice(2);el.prepend(box);
  if(!esTwitch(src)){const f=document.createElement('iframe');f.src=iframe(src,muted);
    f.allow='autoplay; fullscreen; encrypted-media';f.allowFullscreen=true;f.title=nombre(src);box.appendChild(f);return {tipo:'frame',frame:f};}
  const p=new Twitch.Player(box.id,{channel:src,width:'100%',height:'100%',parent:[HOST],muted:!!muted,autoplay:true});
  p.addEventListener(Twitch.Player.ONLINE,()=>{live.add(src);pintarLista()});
  p.addEventListener(Twitch.Player.OFFLINE,()=>{live.delete(src);pintarLista();saltarSiApagado(src)});
  return {tipo:'tw',player:p};
}
function silenciar(i,m){const t=tiles[i];if(!t)return;
  if(t.h.tipo==='tw'){try{t.h.player.setMuted(m)}catch(e){}}
  else{const nuevo=iframe(t.src,m); if(t.h.frame.src!==nuevo) t.h.frame.src=nuevo;}}
function pintarMonitor(i){
  const t=tiles[i];
  let r=t.el.querySelector('.rotulo'); if(!r){r=document.createElement('div');r.className='rotulo';t.el.appendChild(r)}
  r.innerHTML=avatar(t.src)+nombre(t.src);
  let o=t.el.querySelector('.oir');
  if(n>1&&i!==sel){ if(!o){o=document.createElement('button');o.className='oir';o.textContent='Escuchar este';o.onclick=()=>{tocado=true;elegir(i)};t.el.appendChild(o)} }
  else o?.remove();
  t.el.classList.toggle('antena',i===sel);
}
function pintarFicha(){
  const s=tiles[sel]?.src; if(!s) return;
  $('#ficha').innerHTML=`${avatar(s)}<div><h1>${nombre(s)}</h1><p>${queHace(s)} · ${plataforma(s)}${n>1?' · se oye este':''}</p></div>`
    + (anterior&&!tiles.some(t=>t.src===anterior)?`<button class="boton volver" id="volver">↩ Volver a ${nombre(anterior)}</button>`:'');
  $('#volver')?.addEventListener('click',()=>{const a=anterior;anterior=tiles[sel].src;poner(sel,a);});
}
function elegir(i){sel=i;tiles.forEach((_,j)=>{silenciar(j,j!==sel);pintarMonitor(j)});pintarFicha();pintarLista()}
function poner(i,src){
  const t=tiles[i]; if(t.src===src) return;
  if(t.h.tipo==='tw'&&esTwitch(src)){t.h.player.setChannel(src);t.src=src}
  else{t.src=src;t.h=montar(t.el,src,i!==sel)}
  pintarMonitor(i);pintarFicha();pintarLista();store.set('tiles',tiles.map(x=>x.src));
}

/* Qué poner al entrar: lo que está en directo; si no se sabe, lo típico de esta franja */
function candidatos(){
  const f=franja(); const vivos=CANALES.filter(c=>live.has(c.id)).sort((a,b)=>f.orden.indexOf(a.sec)-f.orden.indexOf(b.sec));
  const porFranja=f.orden.flatMap(sec=>CANALES.filter(c=>c.sec===sec));
  return [...new Set([...vivos,...porFranja].map(c=>c.id))];
}
/* Si al entrar el directo está apagado, pasa solo al siguiente; si no hay nadie, pone el 24 Horas (hasta que el usuario toque algo) */
function saltarSiApagado(){}
function comprobarArranque(){
  if(tocado||saltos>12) return;
  const t=tiles[sel]; if(!t||!esTwitch(t.src)||live.has(t.src)) return;
  probados.add(t.src);
  const ocupados=tiles.map(x=>x.src);
  const sig=candidatos().find(c=>esTwitch(c)&&!ocupados.includes(c)&&!probados.has(c));
  saltos++;
  if(sig&&saltos<=10) poner(sel,sig); else poner(sel,'tv:rtve24h');
}
setInterval(comprobarArranque,5000);
const probados=new Set();
function layout(nuevo){
  const prev=tiles.map(t=>t.src);
  n=nuevo; $('#monitores').className='monitores n'+n;
  document.querySelectorAll('.vistas button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.n===n));
  const base=prev.length?prev:store.get('tiles',null)||[];
  const lista=[...new Set([...base,...candidatos()])].slice(0,n);
  $('#monitores').innerHTML='';tiles=[];if(sel>=n)sel=0;
  lista.forEach((src,i)=>{const el=document.createElement('div');el.className='monitor';$('#monitores').appendChild(el);
    tiles.push({src,el,h:montar(el,src,i!==sel)});pintarMonitor(i)});
  store.set('n',n);pintarFicha();pintarLista();
}

/* ================= Carril con sectores ================= */
function filaCanal(c){
  const enPantalla=tiles.some(t=>t.src===c.id);
  return `<button class="canal${live.has(c.id)?' vivo':''}" data-src="${c.id}" ${enPantalla?'aria-current="true"':''}>
    ${avatar(c.id)}<span class="txt"><span class="nom">${c.n}</span><span class="que">${queHace(c.id)}</span></span>
    ${enPantalla?'<span class="pantalla">En pantalla</span>':''}</button>`;
}
function pintarSectores(){
  const f=franja();
  $('#sectores').innerHTML=SECTORES.map(s=>{
    const cuantos=s.id==='ahora'?CANALES.filter(c=>live.has(c.id)).length:CANALES.filter(c=>c.sec===s.id&&live.has(c.id)).length;
    return `<button role="tab" aria-selected="${sector===s.id}" data-sec="${s.id}">${s.n}${cuantos?`<i>${cuantos}</i>`:''}</button>`}).join('');
  $('#sectores').querySelectorAll('button').forEach(b=>b.onclick=()=>{sector=b.dataset.sec;pintarLista()});
  $('#franja').textContent=`${f.n} suele haber más directos en ${SECTORES.find(s=>s.id===f.orden[0]).n}`;
}
function pintarLista(){
  pintarSectores();
  let html='';
  if(sector==='ahora'){
    const vivos=CANALES.filter(c=>live.has(c.id));
    const f=franja();
    if(vivos.length) html+=`<div class="grupo">En directo ahora</div>${vivos.map(filaCanal).join('')}`;
    html+=`<div class="grupo">Lo de esta hora</div>`+CANALES.filter(c=>f.orden.slice(0,2).includes(c.sec)&&c.sec!=='noticias'&&!live.has(c.id)).sort((a,b)=>f.orden.indexOf(a.sec)-f.orden.indexOf(b.sec)).map(filaCanal).join('');
    html+=`<div class="grupo">Siempre en directo</div>`+CANALES.filter(c=>c.sec==='noticias').map(filaCanal).join('');
  } else {
    const lista=CANALES.filter(c=>c.sec===sector).sort((a,b)=>live.has(b.id)-live.has(a.id));
    html=lista.map(filaCanal).join('');
  }
  $('#lista').innerHTML=html;
  $('#lista').querySelectorAll('.canal').forEach(b=>b.onclick=()=>{tocado=true;irA(b.dataset.src)});
  pintarFicha();
}
function irA(src){const ya=tiles.findIndex(t=>t.src===src);if(ya>=0){elegir(ya);return}anterior=tiles[sel].src;poner(sel,src)}

/* ================= Avisos ================= */
function encolar(m){
  if(vistos.has(m.id))return; vistos.add(m.id); store.set('vistos',[...vistos].slice(-200));
  if(!m.urgente){ if(!avisos)return; if(tiles.some(t=>t.src===m.canal))return;
    if(m.hora&&(Date.now()-new Date(m.hora))/60000>MAX_EDAD_MIN)return; }
  m.urgente?cola.unshift(m):cola.push(m); if(!actual)siguiente();
}
function siguiente(){
  actual=cola.shift(); if(!actual)return;
  const m=actual, p=$('#previo');
  p.classList.toggle('urgente',!!m.urgente);
  $('#pAv').outerHTML=avatar(m.canal).replace('class="av','id="pAv" class="av');
  $('#pEstado').textContent=m.urgente?'Última hora':(m.multiplicador>=6?'Está explotando ahora':'Está pasando ahora');
  $('#pTema').textContent=m.tema||nombre(m.canal);
  $('#pFrase').innerHTML=[m.resumen||m.titulo||'', m.categoria?`<b>${m.categoria}</b>`:''].filter(Boolean).join(' · ');
  const tele=$('#pTele'); tele.innerHTML='';
  if(!esTwitch(m.canal)){tele.innerHTML=`<iframe title="${nombre(m.canal)}" src="${iframe(m.canal,true)}" allow="autoplay; encrypted-media"></iframe>`}
  else if(m.clip){tele.innerHTML=`<iframe title="Clip" src="https://clips.twitch.tv/embed?clip=${encodeURIComponent(m.clip)}&parent=${HOST}&autoplay=true&muted=true" allowfullscreen></iframe>`}
  else{const d=document.createElement('div');d.id='pTw';tele.appendChild(d);new Twitch.Player('pTw',{channel:m.canal,width:'100%',height:'100%',parent:[HOST],muted:true,autoplay:true})}
  $('#pCambiar').textContent=m.urgente?'Ver la última hora':'Cambiar a este directo';
  p.classList.add('si');p.setAttribute('aria-hidden','false');
  const r=$('#pReloj'); r.style.transition='none'; r.style.strokeDashoffset='0';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{r.style.transition=`stroke-dashoffset ${AVISO_SEG}s linear`;r.style.strokeDashoffset='94.25'}));
  clearTimeout(timer); timer=setTimeout(()=>cerrar(false),AVISO_SEG*1000);
}
function cerrar(cambiar){
  clearTimeout(timer); const m=actual, p=$('#previo');
  p.classList.remove('si');p.setAttribute('aria-hidden','true');setTimeout(()=>{$('#pTele').innerHTML=''},450);
  if(cambiar&&m){tocado=true;anterior=tiles[sel].src;poner(sel,m.canal);silenciar(sel,false);corto('Ahora ves a '+nombre(m.canal))}
  actual=null; setTimeout(siguiente,900);
}
$('#pCambiar').onclick=()=>cerrar(true); $('#pSeguir').onclick=()=>cerrar(false);
document.addEventListener('keydown',e=>{if(!actual)return;if(e.key==='Escape')cerrar(false)});

/* ================= Lo que manda el motor ================= */
async function leerEstado(){
  try{
    const r=await fetch(ESTADO_URL+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok)return; const e=await r.json();
    if(Array.isArray(e.en_directo)&&e.actualizado){live=new Set([...e.en_directo,...[...live].filter(x=>tiles.some(t=>t.src===x))]);}
    if(e.info) info=e.info;
    pintarLista();
    (e.momentos||[]).forEach(encolar);
    const uh=e.ultima_hora;
    if(uh&&uh.id){$('#ultimaTxt').textContent=uh.titulo||'';$('#ultima').classList.add('si');$('#ultimaVer').onclick=()=>irA(uh.canal);encolar({...uh,urgente:true})}
    else $('#ultima').classList.remove('si');
  }catch(err){}
}

/* ================= Controles ================= */
document.querySelectorAll('.vistas button').forEach(b=>b.onclick=()=>{tocado=true;layout(+b.dataset.n)});
function pintarAvisos(){const b=$('#avisos');b.setAttribute('aria-pressed',avisos);b.querySelector('.txt').textContent=avisos?'Avisos activados':'Avisos desactivados'}
$('#avisos').onclick=()=>{avisos=!avisos;store.set('avisos',avisos);pintarAvisos();corto(avisos?'Te avisaremos cuando pase algo':'Sin avisos: te quedas en tu directo')};
$('#probar').onclick=()=>{
  const libres=CANALES.filter(c=>c.sec!=='noticias'&&!tiles.some(t=>t.src===c.id)); const c=(libres.find(s=>live.has(s.id))||libres[Math.floor(Math.random()*libres.length)]);
  const ej=[
    {tema:`${c.n} sobre la vivienda`,resumen:'Se enfada con el precio de los alquileres',categoria:'Just Chatting',multiplicador:4.4},
    {tema:`${c.n} jugando a Among Us`,resumen:'Le pillan de impostor en la última ronda',categoria:'Among Us',multiplicador:6.2},
    {tema:`${c.n} reacciona a la noticia del día`,resumen:'Opina en directo sobre lo que está pasando',categoria:'Just Chatting',multiplicador:4.1}
  ][Math.floor(Math.random()*3)];
  encolar({id:'demo-'+Date.now(),canal:c.id,...ej,hora:new Date().toISOString()});
};

/* ================= Arranque ================= */
pintarAvisos(); sector='ahora'; layout(store.get('n',1)); leerEstado(); setInterval(leerEstado,POLL_MS);
setInterval(pintarSectores,10*60*1000);
</script>
</body>
