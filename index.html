<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Zona en Directo</title>
<meta name="description" content="El mejor directo de España en cada momento, en un solo canal. Y todos los demás, a un toque.">
<meta name="theme-color" content="#070B1C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<style>
:root{
  --noche:#070B1C; --panel:#0F1530; --panel-2:#161E40; --borde:#252F5C; --borde-suave:rgba(255,255,255,.06);
  --texto:#F1F3FF; --suave:#8E96C4; --tenue:#5D6594;
  --pgm:#FF2D55; --pvw:#19E3A0; --oro:#FFC24B;
  --display:'Bricolage Grotesque','Manrope',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif;
  --r-xl:24px; --r-lg:18px; --r-md:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--texto);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 620px at 78% -8%,#1A2560 0%,transparent 62%),radial-gradient(900px 600px at -12% 108%,#2A0E3A 0%,transparent 58%),var(--noche);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{display:block}
:focus-visible{outline:2px solid var(--pvw);outline-offset:3px;border-radius:10px}
.envoltorio{max-width:1520px;margin:0 auto;padding:0 28px 60px}

/* ---------- Cabecera ---------- */
.cabecera{display:flex;align-items:center;gap:16px;padding:20px 0 18px}
.marca{display:flex;align-items:center;gap:12px;color:var(--texto);text-decoration:none}
.marca .tally{width:14px;height:14px;border-radius:50%;background:var(--pgm);box-shadow:0 0 0 5px rgba(255,45,85,.16),0 0 22px var(--pgm);animation:latido 2.4s ease-in-out infinite}
.marca b{font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:-.035em}
.esp{flex:1}
.modos{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(15,21,48,.7);box-shadow:inset 0 0 0 1px var(--borde)}
.modos button{padding:9px 16px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--suave);display:flex;align-items:center;gap:8px}
.modos button[aria-pressed="true"]{background:var(--texto);color:var(--noche)}
.modos .punto{width:7px;height:7px;border-radius:50%;background:var(--pgm)}
.pildora{display:flex;align-items:center;gap:8px;padding:10px 15px;border-radius:999px;background:rgba(15,21,48,.7);box-shadow:inset 0 0 0 1px var(--borde);font-weight:700;font-size:13px}
.pildora .luz{width:8px;height:8px;border-radius:50%;background:var(--pvw);box-shadow:0 0 10px var(--pvw)}
.pildora[aria-pressed="false"]{color:var(--suave)} .pildora[aria-pressed="false"] .luz{background:#3C4470;box-shadow:none}

/* ---------- Escenario ---------- */
.escenario{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.pantalla{position:relative}
.monitores{display:grid;gap:12px}
.monitores.n1{grid-template-columns:1fr}
.monitores.n2{grid-template-columns:1fr 1fr}
.monitores.n4{grid-template-columns:1fr 1fr}
.monitor{position:relative;aspect-ratio:16/9;border-radius:var(--r-xl);overflow:hidden;background:#000;
  box-shadow:0 0 0 1px var(--borde),0 40px 80px -40px rgba(0,0,0,.9)}
.monitor.antena{box-shadow:0 0 0 2px var(--pgm),0 0 60px -14px rgba(255,45,85,.6),0 40px 80px -40px rgba(0,0,0,.9)}
.monitor .vid{position:absolute;inset:0}
.monitor .vid iframe{width:100%;height:100%;border:0;display:block}
.monitor .oir{position:absolute;right:12px;top:12px;z-index:3;padding:7px 12px;border-radius:999px;background:rgba(7,11,28,.8);backdrop-filter:blur(8px);font-weight:700;font-size:12px}
.monitor .etiqueta{position:absolute;left:12px;top:12px;z-index:3;pointer-events:none;padding:6px 11px;border-radius:999px;background:rgba(7,11,28,.8);backdrop-filter:blur(8px);font-weight:800;font-size:12.5px}
.monitor.antena .etiqueta{background:var(--pgm)}
.monitores.n1 .etiqueta{display:none}
.portada{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:var(--r-xl);overflow:hidden;background:#05081A;text-align:left;
  box-shadow:0 0 0 2px var(--pgm),0 0 60px -14px rgba(255,45,85,.6),0 40px 80px -40px rgba(0,0,0,.9)}
.portada img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.portada::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,28,0) 30%,rgba(7,11,28,.92))}
.portada .cont{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:clamp(16px,3vw,34px);display:flex;align-items:center;gap:clamp(14px,2vw,24px)}
.portada .play{width:clamp(60px,8vw,96px);aspect-ratio:1;border-radius:50%;background:var(--pgm);display:grid;place-items:center;flex:0 0 auto;
  box-shadow:0 0 0 10px rgba(255,45,85,.18),0 20px 50px -10px rgba(255,45,85,.8);transition:transform .2s ease}
.portada:hover .play{transform:scale(1.07)}
.portada .play svg{width:36%;margin-left:9%}
.portada small{display:block;color:#FF9DB2;font-weight:800;font-size:14px;margin-bottom:4px}
.portada strong{display:block;font-family:var(--display);font-weight:800;font-size:clamp(26px,4.2vw,50px);letter-spacing:-.035em;line-height:1}
.portada p{margin:7px 0 0;color:#C9CEEA;font-weight:600;font-size:clamp(13px,1.4vw,16px)}
.portada .sinimg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(60px,12vw,160px);color:#1C2552}
.cortinilla{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,rgba(7,11,28,.55),rgba(7,11,28,.92));opacity:0;pointer-events:none;transition:opacity .35s}
.cortinilla.si{opacity:1}
.cortinilla div{text-align:center}
.cortinilla small{display:block;color:var(--pvw);font-weight:800;font-size:13px;letter-spacing:.02em;margin-bottom:6px}
.cortinilla strong{font-family:var(--display);font-size:clamp(28px,4vw,52px);letter-spacing:-.03em;line-height:1}
.cortinilla p{margin:8px 0 0;color:var(--suave);font-weight:600}

.barra{display:flex;align-items:center;gap:16px;margin-top:16px}
.barra .av{width:54px;height:54px;font-size:19px}
.barra h1{margin:0;font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-.03em;line-height:1.02}
.barra .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:5px;color:var(--suave);font-weight:600;font-size:14px}
.barra .meta b{color:var(--texto)}
.barra .acciones{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.boton{padding:11px 16px;border-radius:999px;font-weight:800;font-size:13.5px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--borde)}
.boton.prim{background:var(--texto);color:var(--noche);box-shadow:none}
.sello{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(255,45,85,.14);color:#FF8FA6}
.sello::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pgm);box-shadow:0 0 8px var(--pgm)}
.porque{margin-top:12px;padding:12px 14px;border-radius:var(--r-md);background:rgba(15,21,48,.6);box-shadow:inset 0 0 0 1px var(--borde-suave);color:var(--suave);font-size:13.5px;font-weight:600}
.porque b{color:var(--texto)}

.av{display:grid;place-items:center;border-radius:50%;font-family:var(--display);font-weight:800;color:#fff;flex:0 0 auto;background:hsl(var(--h) 65% 42%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14)}
.av.tv{background:#2B335E}

/* ---------- Ranking ---------- */
.ranking{background:linear-gradient(180deg,rgba(15,21,48,.9),rgba(15,21,48,.55));border-radius:var(--r-xl);box-shadow:inset 0 0 0 1px var(--borde);padding:18px 14px 12px;position:sticky;top:16px}
.ranking h2{margin:0 6px;font-family:var(--display);font-size:19px;letter-spacing:-.02em}
.ranking .sub{margin:3px 6px 12px;color:var(--suave);font-size:12.5px;font-weight:600}
.fila{width:100%;display:grid;grid-template-columns:22px 40px 1fr auto;align-items:center;gap:10px;padding:9px 8px;border-radius:var(--r-md);text-align:left}
.fila:hover{background:var(--panel-2)}
.fila .pos{font-family:var(--display);font-weight:800;color:var(--tenue);text-align:center}
.fila:first-of-type .pos{color:var(--oro)}
.fila .av{width:40px;height:40px;font-size:14px}
.fila .nom{font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .cat{display:block;color:var(--suave);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .dato{text-align:right;font-weight:800;font-size:13px}
.fila .dato small{display:block}
.fila[aria-current="true"]{background:rgba(255,45,85,.1);box-shadow:inset 0 0 0 1px rgba(255,45,85,.35)}
.calor{display:inline-flex;gap:2px;vertical-align:middle;margin-top:4px}
.calor i{width:4px;height:10px;border-radius:2px;background:#2A3366}
.calor i.on{background:var(--pgm)}
.calor.fria i.on{background:var(--pvw)}
.vacio{padding:16px 8px;color:var(--suave);font-size:13.5px}

/* ---------- Rejilla ---------- */
.seccion{margin-top:38px}
.seccion-cab{display:flex;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.seccion-cab h2{margin:0;font-family:var(--display);font-size:28px;letter-spacing:-.03em}
.seccion-cab p{margin:2px 0 0;color:var(--suave);font-weight:600;font-size:14px}
.filtros{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.filtros button{padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;color:var(--suave);background:rgba(15,21,48,.7);box-shadow:inset 0 0 0 1px var(--borde)}
.filtros button[aria-pressed="true"]{background:var(--texto);color:var(--noche);box-shadow:none}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.tarjeta{text-align:left;border-radius:var(--r-lg);overflow:hidden;background:var(--panel);box-shadow:inset 0 0 0 1px var(--borde-suave);transition:transform .2s ease,box-shadow .2s ease}
.tarjeta:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1px var(--borde),0 24px 40px -24px rgba(0,0,0,.9)}
.tarjeta .mini{position:relative;aspect-ratio:16/9;background:#05081A}
.tarjeta .mini img{width:100%;height:100%;object-fit:cover}
.tarjeta .mini .sello{position:absolute;left:10px;top:10px;background:rgba(7,11,28,.82);backdrop-filter:blur(6px)}
.tarjeta .mini .viendo{position:absolute;right:10px;top:10px;padding:5px 9px;border-radius:999px;background:var(--pgm);font-size:11.5px;font-weight:800}
.tarjeta .mini .fuego{max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:absolute;right:10px;bottom:10px;padding:5px 9px;border-radius:999px;background:rgba(7,11,28,.82);font-size:11.5px;font-weight:800;color:#FFB4C3}
.tarjeta .mini .sin{position:absolute;inset:0;display:grid;place-items:center;color:var(--tenue);font-weight:800;font-family:var(--display);font-size:22px}
.tarjeta .info{display:flex;gap:11px;align-items:center;padding:12px 14px 14px}
.tarjeta .info .av{width:36px;height:36px;font-size:13px}
.tarjeta .info b{display:block;font-weight:800}
.tarjeta .info div span{display:block;color:var(--suave);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.tarjeta.apagada{opacity:.55}
.tarjeta.apagada:hover{opacity:.85}

/* ---------- Previo (aviso) ---------- */
.previo{position:fixed;right:24px;bottom:24px;z-index:50;width:430px;max-width:calc(100vw - 20px);background:rgba(15,21,48,.94);backdrop-filter:blur(18px);border-radius:var(--r-xl);overflow:hidden;
  box-shadow:0 0 0 2px var(--pvw),0 0 50px -10px rgba(25,227,160,.5),0 40px 80px -20px rgba(0,0,0,.9);transform:translateY(calc(100% + 40px));opacity:0;transition:transform .45s cubic-bezier(.2,.9,.25,1.15),opacity .3s}
.previo.si{transform:none;opacity:1}
.previo .cab{display:flex;gap:12px;align-items:center;padding:14px 16px 8px}
.previo .av{width:40px;height:40px;font-size:15px}
.previo .estado{font-size:12px;font-weight:800;color:var(--pvw)}
.previo h3{margin:2px 0 0;font-family:var(--display);font-size:21px;letter-spacing:-.025em;line-height:1.1}
.previo .reloj{margin-left:auto;width:32px;height:32px;flex:0 0 auto}
.previo .reloj circle{fill:none;stroke-width:3}.previo .reloj .f{stroke:var(--borde)}.previo .reloj .r{stroke:var(--pvw);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.previo .frase{margin:0;padding:0 16px 12px;color:var(--suave);font-size:13.5px;font-weight:600}
.previo .tele{position:relative;aspect-ratio:16/9;background:#000;margin:0 12px;border-radius:var(--r-md);overflow:hidden}
.previo .tele iframe,.previo .tele>div{width:100%;height:100%;border:0}
.previo .acc{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;padding:12px}
.previo .acc button{padding:13px;border-radius:var(--r-md);font-weight:800}
.previo .si-cambiar{background:var(--pvw);color:#032B1E}
.previo .no{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--borde)}

.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-30px);opacity:0;z-index:60;padding:10px 16px;border-radius:999px;background:var(--panel-2);box-shadow:0 0 0 1px var(--borde);font-weight:700;font-size:13px;transition:.3s}
.toast.si{transform:translate(-50%,0);opacity:1}
@keyframes latido{50%{box-shadow:0 0 0 9px rgba(255,45,85,.05),0 0 22px var(--pgm)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1100px){
  .escenario{grid-template-columns:1fr}
  .ranking{position:static}
}
@media (max-width:640px){
  .envoltorio{padding:0 12px 40px}
  .cabecera{flex-wrap:wrap;gap:10px;padding:14px 0}
  .marca b{font-size:20px}
  .modos{order:3;width:100%;justify-content:space-between}
  .modos button{flex:1;justify-content:center;padding:9px 6px}
  .pildora .txt{display:none}
  .monitores.n2,.monitores.n4{gap:6px}
  .monitor{border-radius:14px}
  .barra{flex-wrap:wrap}
  .barra h1{font-size:24px}
  .barra .acciones{margin-left:0;width:100%;justify-content:flex-start}
  .rejilla{grid-template-columns:1fr 1fr;gap:10px}
  .tarjeta .info{padding:9px 10px 11px}
  .tarjeta .info .av{display:none}
  .seccion-cab h2{font-size:23px}
  .filtros{margin-left:0}
  .previo{left:10px;right:10px;bottom:10px;width:auto}
}
</style>
</head>
<body>
<div class="envoltorio">
  <header class="cabecera">
    <a class="marca" href="./"><span class="tally" aria-hidden="true"></span><b>La Zona en Directo</b></a>
    <div class="esp"></div>
    <div class="modos" role="group" aria-label="Cómo quieres verlo">
      <button data-modo="zona" aria-pressed="true"><span class="punto"></span>Canal La Zona</button>
      <button data-modo="uno" aria-pressed="false">Elegir directo</button>
      <button data-modo="multi" aria-pressed="false">Multivista</button>
    </div>
    <button class="pildora" id="avisos" aria-pressed="true" title="Avisarme cuando pase algo en otro directo"><span class="luz"></span><span class="txt">Avisos</span></button>
  </header>

  <section class="escenario">
    <div class="pantalla">
      <div class="monitores n1" id="monitores"></div>
      <div class="barra" id="barra"></div>
      <div class="porque" id="porque" hidden></div>
    </div>
    <aside class="ranking" aria-label="Lo más fuerte ahora">
      <h2>Lo más fuerte ahora</h2>
      <p class="sub">Lo que está pasando en el chat, no solo cuánta gente hay</p>
      <div id="ranking"></div>
    </aside>
  </section>

  <section class="seccion">
    <div class="seccion-cab">
      <div><h2>Todos los directos</h2><p id="resumen">Comprobando quién está en directo…</p></div>
      <div class="filtros" id="filtros"></div>
    </div>
    <div class="rejilla" id="rejilla"></div>
  </section>
</div>

<div class="previo" id="previo" role="dialog" aria-label="Está pasando algo en otro directo" aria-hidden="true">
  <div class="cab"><span class="av" id="pAv"></span><div><div class="estado" id="pEstado">Está pasando ahora</div><h3 id="pTema"></h3></div>
    <svg class="reloj" viewBox="0 0 36 36" aria-hidden="true"><circle class="f" cx="18" cy="18" r="15"/><circle class="r" id="pReloj" cx="18" cy="18" r="15" stroke-dasharray="94.25" stroke-dashoffset="0"/></svg></div>
  <p class="frase" id="pFrase"></p>
  <div class="tele" id="pTele"></div>
  <div class="acc"><button class="si-cambiar" id="pCambiar">Cambiar a este directo</button><button class="no" id="pSeguir">Seguir aquí</button></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= Canales =================
   sec: es · latam · esports · noticias. Kick = "kick:<canal>", tele = "tv:<id>". */
const CANALES = [
  {id:'ibai',n:'Ibai',sec:'es'},{id:'rubius',n:'Rubius',sec:'es'},{id:'illojuan',n:'IlloJuan',sec:'es'},
  {id:'elxokas',n:'Xokas',sec:'es'},{id:'auronplay',n:'Auronplay',sec:'es'},{id:'thegrefg',n:'TheGrefg',sec:'es'},
  {id:'knekro',n:'Knekro',sec:'es'},{id:'mixwell',n:'Mixwell',sec:'es'},{id:'peereira7',n:'Pereira',sec:'es'},
  {id:'agustin51',n:'Agustin51',sec:'es'},{id:'nilojeda',n:'Nil Ojeda',sec:'es'},{id:'djmariio',n:'DjMaRiiO',sec:'es'},
  {id:'baitybait',n:'BaityBait',sec:'es'},{id:'revenant',n:'Revenant',sec:'es'},{id:'lolito',n:'Lolito',sec:'es'},
  {id:'spursito',n:'Spursito',sec:'es'},{id:'cristinini',n:'Cristinini',sec:'es'},{id:'nissaxter',n:'Nissaxter',sec:'es'},
  {id:'zeling',n:'Zeling',sec:'es'},{id:'vegetta777',n:'Vegetta777',sec:'es'},{id:'willyrex',n:'Willyrex',sec:'es'},
  {id:'paache_',n:'Paache',sec:'es'},{id:'rickyedit',n:'Rickyedit',sec:'es'},{id:'carola',n:'Carola',sec:'es'},
  {id:'juniorhealy',n:'JuniorHealy',sec:'es'},{id:'skain',n:'Skain',sec:'es'},
  {id:'juansguarnizo',n:'Juan Guarnizo',sec:'latam'},{id:'rivers_gg',n:'Rivers',sec:'latam'},{id:'crystalmolly',n:'Crystal Molly',sec:'latam'},
  {id:'kick:westcol',n:'Westcol',sec:'latam'},{id:'kick:davooxeneize',n:'Davoo Xeneize',sec:'latam'},
  {id:'kick:lacobraaa',n:'La Cobra',sec:'latam'},{id:'kick:spreen',n:'Spreen',sec:'latam'},
  {id:'kick:mrstiventc',n:'MrStiven',sec:'latam'},{id:'kick:rdjavi',n:'RDJavi',sec:'latam'},
  {id:'les',n:'LES · Liga española de LoL',sec:'esports'},{id:'lolesportsla',n:'LoL Esports en español',sec:'esports'},
  {id:'kingsleague',n:'Kings League',sec:'esports'},
  {id:'tv:rtve24h',n:'Canal 24 Horas',sec:'noticias',sub:'RTVE · noticias 24 h',yt:'UC7QZIf0dta-XPXsp9Hv4dTw',video:'b4tE5aKhtlg'}
];
const FILTROS=[{id:'todos',n:'En directo'},{id:'es',n:'España'},{id:'latam',n:'Latinoamérica'},{id:'esports',n:'Esports y eventos'},{id:'noticias',n:'Noticias'}];
const HOST=location.hostname||'localhost';
const PERMANENCIA_MIN=150, AVISO_SEG=25, CHAT_MAX=30;

/* ================= Estado ================= */
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('lzd2_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('lzd2_'+k,JSON.stringify(v))}catch(e){}}};
const esTV=s=>s.startsWith('tv:'), esKick=s=>s.startsWith('kick:'), esTwitch=s=>!esTV(s)&&!esKick(s);
const canal=s=>CANALES.find(c=>c.id===s)||{id:s,n:s,sec:'es'};
const nombre=s=>canal(s).n;
const datos={};
const chat={};
let modo=store.get('modo','zona'), n=store.get('n',2), tiles=[], sel=0, filtro='todos';

  const r30=rec.length/30, base=edad>45?viejo.length/edad:r30, calor=base>0.05?r30/base:1;
  const u30=new Set(rec.map(m=>m.u)).size;let ubase=u30;
  if(edad>45){const cub={};viejo.forEach(m=>{const k=Math.floor((now-m.t)/30000);(cub[k]=cub[k]||new Set()).add(m.u)});const vs=Object.values(cub).map(x=>x.size);if(vs.length)ubase=vs.reduce((a,b)=>a+b,0)/vs.length}

  const r20=c.m.filter(m=>now-m.t<20000), cuenta={};r20.forEach(m=>{if(m.k)(cuenta[m.k]=cuenta[m.k]||new Set()).add(m.u)});

  const autores=new Set(r20.map(m=>m.u)).size, unanim=top&&top[1]>=4&&autores?top[1]/autores:0;

  const ev2=c.ev.filter(e=>now-e.t<120000), evPeso=ev2.reduce((a,e)=>a+e.w,0);
  const subs=ev2.filter(e=>e.k==='sub').reduce((a,e)=>a+e.n,0), raid=ev2.filter(e=>e.k==='raid').pop()||null, bits=ev2.filter(e=>e.k==='bits').reduce((a,e)=>a+e.n,0);
  const pal={};c.m.filter(m=>now-m.t<60000&&!m.r).forEach(m=>{new Set(m.x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').match(/[a-zñ0-9]{4,}/g)||[]).forEach(w=>{if(STOP.has(w)||/^(ja|je|xd|js|kek)/.test(w)||/^\d+$/.test(w)||w===s||MALAS.test(w))return;(pal[w]=pal[w]||new Set()).add(m.u)})});
  const temas=Object.entries(pal).map(([w,u])=>[w,u.size]).filter(x=>x[1]>=3).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);

function actualizarAnalisis(){for(const s in chat){const c=chat[s],a=analizar(s);if(!a)continue;c.a=a;c.ema=c.ema==null?a.momento:0.55*c.ema+0.45*a.momento}}
function ritmo(s){return (chat[s]&&chat[s].a)||{r30:0,base:0,calor:1,u30:0,reacc:0,frase:'',subs:0,raid:null,bits:0,temas:[],crec:0,f:{},momento:0}}

function puntos(s){const d=datos[s]||{};if(!d.vivo)return -1;const v=d.espectadores||0;const aud=cl((Math.log10(v+10)-2.7)/2.3);return (0.4*aud+0.6*momento(s))*(v<800?0.6:1)}
function barritas(m){const k=1+Math.round(cl(m/0.6)*4);return `<span class="calor${m<0.15?' fria':''}" title="Momento ${Math.round(m*100)}/100">${[1,2,3,4,5].map(i=>`<i class="${i<=k?'on':''}"></i>`).join('')}</span>`}
function frasechat(s){return ritmo(s).frase||''}
/* Razones legibles de por qué un directo está interesante ahora */
function razones(s){const a=ritmo(s),f=a.f||{},r=[];
  if(a.raid)r.push(`raid de ${a.raid.de||'otro canal'} con ${fmt(a.raid.n)} personas`);
  if(a.frase&&f.unanim>0.2)r.push(`todo el chat grita «${a.frase}»`);
  if(a.temas.length&&momento(s)>0.2)r.push(`se habla de ${a.temas.join(', ')}`);
  if(f.reacc>0.3)r.push('lluvia de risas y reacciones');
  if(f.calor>0.3)r.push(`el chat va ${coma(a.calor)} veces más rápido de lo normal`);
  if(f.gente>0.3)r.push(`${a.u30} personas escribiendo a la vez`);
  if(a.subs>=3)r.push(`${a.subs} subs en 2 minutos`);
  if(a.bits>=500)r.push(`${fmt(a.bits)} bits en 2 minutos`);

  return r}

/* ================= Quién está en directo (decapi.me) ================= */
async function comprobarDirectos(){
  const tw=CANALES.filter(c=>esTwitch(c.id)).map(c=>c.id);
  await Promise.all(tw.map(async c=>{
    try{const t=(await (await fetch('https://decapi.me/twitch/viewercount/'+c,{cache:'no-store'})).text()).trim();
      const d=datos[c]=datos[c]||{};
      if(/^\d+$/.test(t)){const nuevo=!d.vivo;d.vivo=true;d.espectadores=+t;if(nuevo||!d.categoria)d.pedirCat=true;
        const now=Date.now();d.hist=(d.hist||[]).filter(x=>now-x.t<900000);d.hist.push({t:now,v:+t});const old=d.hist.find(x=>now-x.t>=480000);d.crec=old&&old.v>50?(+t-old.v)/old.v:0}
      else if(/offline/i.test(t)){d.vivo=false;d.espectadores=0}
    }catch(e){}
  }));
  conectarChats(); pintarTodo(); if(!primeraCarga)decidirZona();
  await Promise.all(tw.filter(c=>datos[c]&&datos[c].vivo&&(datos[c].pedirCat||!datos[c].catHora||Date.now()-datos[c].catHora>600000)).map(async c=>{

      if(g&&!/error|offline/i.test(g)){datos[c].categoria=g==='Just Chatting'?'Charlando':g;datos[c].catHora=Date.now();datos[c].pedirCat=false}}catch(e){}
  }));
  pintarTodo();
}

function sincronizar(quiero){

function urlFrame(s,muted){if(esTV(s)){const c=canal(s);return `https://www.youtube.com/embed/${c.video}?autoplay=1&mute=${muted?1:0}`}
  return `https://player.kick.com/${s.slice(5)}?autoplay=true&muted=${muted?'true':'false'}`}
function montar(el,s,muted){
  el.querySelector('.vid')?.remove();
  const box=document.createElement('div');box.className='vid';box.id='v'+Math.random().toString(36).slice(2);el.prepend(box);
  if(!esTwitch(s)){const f=document.createElement('iframe');f.src=urlFrame(s,muted);f.allow='autoplay; fullscreen; encrypted-media';f.allowFullscreen=true;f.title=nombre(s);box.appendChild(f);return {tipo:'frame',f}}
  const p=new Twitch.Player(box.id,{channel:s,width:'100%',height:'100%',parent:[HOST],muted:!!muted,autoplay:true});return {tipo:'tw',p};
}
function silenciar(i,m){const t=tiles[i];if(!t)return;if(t.h.tipo==='tw'){try{t.h.p.setMuted(m)}catch(e){}}else{const u=urlFrame(t.src,m);if(t.h.f.src!==u)t.h.f.src=u}}

/* ================= Canal La Zona: decide qué poner ================= */
function decidirZona(){
  if(!arrancado){const b=modo==='zona'?(mejores()[0]||'tv:rtve24h'):null;if(b&&b!==portadaSrc)construir();return}
  if(modo!=='zona')return;
  const best=mejores()[0];
  if(!best){if(enZona!=='tv:rtve24h')cambiarZona('tv:rtve24h');return}
  if(best===enZona)return;
  const cur=enZona, pc=vivo(cur)&&!esTV(cur)?puntos(cur):-1, pb=puntos(best), seg=(Date.now()-ultimoCambio)/1000;
  if(pc<0) return cambiarZona(best);
  if(seg>=PERMANENCIA_MIN && pb>pc*1.18) return cambiarZona(best);
  if(seg>=60 && momento(best)>=0.5 && pb>pc*1.05) return cambiarZona(best);
}
function motivo(s){const d=datos[s]||{};const p=razones(s);if(d.espectadores)p.push(fmt(d.espectadores)+' espectadores');return p.join(' · ')}

  const c=$('#cort');if(c){$('#cortNom').textContent=nombre(s);$('#cortPor').textContent=categoria(s);c.classList.add('si');setTimeout(()=>c.classList.remove('si'),2600)}
  setTimeout(()=>{enZona=s;ultimoCambio=Date.now();poner(0,s)},900);
}

  const s=tiles[sel]?.src||portadaSrc;if(!s)return;const d=datos[s]||{};
  const meta=[vivo(s)&&!esTV(s)?`<span class="sello">En directo</span>`:'',`<span>${categoria(s)}</span>`,d.espectadores?`<span><b>${fmt(d.espectadores)}</b> viendo</span>`:'',esTwitch(s)&&chat[s]?`<span>Chat ${barritas(momento(s))}</span>`:''].filter(Boolean).join('');
  const acc=(sonido||!arrancado?'':`<button class="boton prim" id="bSonido">Activar sonido</button>`)+(modo==='zona'?`<button class="boton" id="bQuedar">Quedarme en este directo</button>`:`<button class="boton prim" id="bZona">Volver al Canal La Zona</button>`);
  $('#barra').innerHTML=`${avatar(s)}<div><h1>${nombre(s)}</h1><div class="meta">${meta}</div></div><div class="acciones">${acc}</div>`;
  $('#bQuedar')?.addEventListener('click',()=>{store.set('tiles',[s]);ponerModo('uno')});
  $('#bZona')?.addEventListener('click',()=>ponerModo('zona'));
  $('#bSonido')?.addEventListener('click',activarSonido);
  const por=$('#porque');
  if(modo==='zona'){por.hidden=false;const m=motivo(s);por.innerHTML=esTV(s)?'Ahora mismo hay poco en directo, así que el Canal La Zona pone las noticias 24 horas. En cuanto empiece algo fuerte, cambia solo.':`<b>Por qué estás viendo esto:</b> es lo más interesante ahora mismo${m?' · '+m:''}. El Canal La Zona cambia solo cuando otro directo se pone más interesante.`}
  else por.hidden=true;
}
function pintarRanking(){
  const top=mejores().slice(0,7);
  $('#ranking').innerHTML=top.length?top.map((s,i)=>{const d=datos[s];return `<button class="fila" data-src="${s}" ${tiles.some(t=>t.src===s)?'aria-current="true"':''}><span class="pos">${i+1}</span>${avatar(s)}<span style="min-width:0"><span class="nom">${nombre(s)}</span><span class="cat">${momento(s)>=0.3&&razonCorta(s)?'🔥 '+razonCorta(s):categoria(s)}</span></span><span class="dato">${fmt(d.espectadores||0)}<small>${barritas(momento(s))}</small></span></button>`}).join('')
    :`<div class="vacio">Ahora mismo no hay ningún directo grande. Te avisamos en cuanto empiece alguien.</div>`;
  $('#ranking').querySelectorAll('.fila').forEach(b=>b.onclick=()=>verDirecto(b.dataset.src));
}
function miniatura(s){if(!esTwitch(s)||!vivo(s))return '';const t=Math.floor(Date.now()/120000);return `<img loading="lazy" alt="" src="https://static-cdn.jtvnw.net/previews-ttv/live_user_${s}-440x248.jpg?t=${t}">`}
function pintarRejilla(){
  $('#filtros').innerHTML=FILTROS.map(f=>`<button data-f="${f.id}" aria-pressed="${filtro===f.id}">${f.n}</button>`).join('');
  $('#filtros').querySelectorAll('button').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;pintarRejilla()});
  let lista=CANALES.filter(c=>filtro==='todos'?(vivo(c.id)&&!esTV(c.id)):c.sec===filtro);
  lista.sort((a,b)=>puntos(b.id)-puntos(a.id));
  const nv=CANALES.filter(c=>esTwitch(c.id)&&vivo(c.id)).length;
  $('#resumen').textContent=nv?`${nv} directos en marcha ahora · toca uno para verlo`:'Ahora mismo hay muy poco en directo · el Canal La Zona te pone las noticias';
  $('#rejilla').innerHTML=lista.map(c=>{const s=c.id,d=datos[s]||{},r=ritmo(s),v=vivo(s);
    return `<button class="tarjeta${v||esKick(s)?'':' apagada'}" data-src="${s}"><div class="mini">${miniatura(s)||`<div class="sin">${esTV(s)?'24 h':esKick(s)?'KICK':'Sin directo'}</div>`}
      ${v&&!esTV(s)?`<span class="sello">En directo</span><span class="viendo">${fmt(d.espectadores||0)}</span>`:''}${v&&momento(s)>=0.3&&razonCorta(s)?`<span class="fuego">${razonCorta(s)}</span>`:''}</div>
      <div class="info">${avatar(s)}<div style="min-width:0"><b>${c.n}</b><span>${categoria(s)}</span></div></div></button>`}).join('')||`<div class="vacio">Aquí no hay nadie en directo ahora mismo.</div>`;
  $('#rejilla').querySelectorAll('.tarjeta').forEach(b=>b.onclick=()=>verDirecto(b.dataset.src));
}
function verDirecto(s){
  if(!arrancado){arrancado=true;sonido=true;store.set('tiles',[s]);if(modo==='zona'){ponerModo('uno')}else construir();window.scrollTo({top:0,behavior:'smooth'});return}
  if(modo==='zona'){store.set('tiles',[s]);ponerModo('uno');window.scrollTo({top:0,behavior:'smooth'});return}
  const ya=tiles.findIndex(t=>t.src===s);if(ya>=0){sel=ya;tiles.forEach((_,j)=>silenciar(j,j!==sel));pintarTodo();return}
  poner(sel,s);silenciar(sel,false);window.scrollTo({top:0,behavior:'smooth'});
}
function ponerModo(m){modo=m;store.set('modo',m);if(m==='multi'&&n<2)n=2;
  document.querySelectorAll('.modos button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.modo===m));construir()}
document.querySelectorAll('.modos button').forEach(b=>b.onclick=()=>{if(b.dataset.modo==='multi'&&modo==='multi'){n=n===2?4:2;store.set('n',n)}ponerModo(b.dataset.modo)});
function activarSonido(){if(sonido)return;sonido=true;tiles.forEach((t,j)=>{silenciar(j,j!==sel);if(t.h.tipo==='tw'){try{t.h.p.play()}catch(e){}}});pintarBarra()}
function pintarAvisos(){$('#avisos').setAttribute('aria-pressed',avisos)}
$('#avisos').onclick=()=>{avisos=!avisos;store.set('avisos',avisos);pintarAvisos();toast(avisos?'Te avisaremos cuando pase algo en otro directo':'Sin avisos: te quedas tranquilo en tu directo')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&actual)cerrar(false)});

/* ================= Lo que manda el motor (estado.json) ================= */
async function leerEstado(){try{const e=await (await fetch('estado.json?t='+Date.now(),{cache:'no-store'})).json();
  (e.momentos||[]).forEach(m=>{if(!m.hora||(Date.now()-new Date(m.hora))/60000<10)encolar(m)});
  if(e.ultima_hora&&e.ultima_hora.id)encolar({...e.ultima_hora,urgente:true,tema:e.ultima_hora.titulo||'Última hora'})}catch(err){}}

/* ================= Arranque ================= */
(async()=>{
  pintarAvisos();
  document.querySelectorAll('.modos button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.modo===modo));
  await Promise.race([comprobarDirectos(),new Promise(r=>setTimeout(r,7000))]);
  construir(); primeraCarga=false;
  if(new URLSearchParams(location.search).has('demo')){const s=mejores()[1]||'ibai';setTimeout(()=>encolar({id:'demo',canal:s,tema:`Se está liando con ${nombre(s)}`,resumen:categoria(s)+' · el chat grita «NOOOO»'}),2500)}
  leerEstado();
  setInterval(comprobarDirectos,90000);
  setInterval(()=>{actualizarAnalisis();decidirZona();buscarMomentos();pintarBarra();pintarRanking()},10000);
  setInterval(pintarRejilla,30000);
  setInterval(leerEstado,20000);
})();
</script>
</body>
